# Ephemeral batch worker: drains eligible (public-asset) jobs and exits.
# NOT the scheduler — qtmesh-cloud's queue is the source of truth.
# Secret QTMESH_RUNNER_TOKEN must be minted with restrictions:
#   { "allowPrivateAssets": false, "maxClaimBatch": 10 }
name: QtMesh Batch Worker

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: qtmesh-batch-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull processor image
        run: docker pull ghcr.io/fernandotonon/qtmesh:latest
      - name: Run QtMesh runner (batch mode)
        env:
          QTMESH_API_URL: https://api.qtmesh.dev
          QTMESH_RUNNER_TOKEN: ${{ secrets.QTMESH_RUNNER_TOKEN }}
          QTMESH_RUNNER_NAME: github-actions
          QTMESH_EPHEMERAL: "1"
        run: node agent.mjs run --max-jobs 10 --exit-when-empty
